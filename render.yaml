services:
  - type: web
    name: referr-platform
    runtime: node
    # Free is fine for internal testing with Supabase Postgres.
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        value: https://referr-platform.onrender.com
      - key: AUTH_DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://referr-platform.onrender.com
      # Supabase Session pooler URI (port 5432) — works from Render IPv4
      - key: DATABASE_URL
        sync: false
      # Same Session pooler URI (or Direct if you have IPv4). Used by Prisma migrate.
      - key: DIRECT_URL
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: STRIPE_PAYOUTS_ENABLED
        value: "false"
      # Transactional email (Resend recommended). When set, AUTH_DEMO_MODE can be false.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: COMING_SOON_HOSTS
        value: "referr.nl,www.referr.nl"
      - key: DATA_DIR
        value: /tmp/referr-data
