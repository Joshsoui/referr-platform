services:
  - type: web
    name: referr-platform
    runtime: node
    # Free is fine for internal testing. Add a Postgres instance and set DATABASE_URL.
    # Upgrade to starter + disk later if you also want file-based stores durable.
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    envVars:
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        value: https://referr-platform.onrender.com
      - key: AUTH_DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://referr-platform.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: STRIPE_PAYOUTS_ENABLED
        value: "false"
      # Optional fallback path when DATABASE_URL is unset (ephemeral on free).
      - key: DATA_DIR
        value: /tmp/referr-data
